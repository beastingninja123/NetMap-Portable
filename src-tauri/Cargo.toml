[package]
name = "netmap-portable"
version = "0.4.0"
description = "Portable metadata-only network flow explorer"
authors = ["NetMap contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "netmap_portable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "netmap-portable"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
etherparse = "0.19"
pcap-parser = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
